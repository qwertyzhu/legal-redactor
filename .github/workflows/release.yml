name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Pack skill archive
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/pack_skill.py --output-dir dist --expect-version "${TAG#v}"
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.skill dist/SHA256SUMS.txt)
          if [ ${#assets[@]} -lt 2 ]; then
            echo "expected .skill archive and SHA256SUMS.txt under dist/" >&2
            ls -la dist || true
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "legal-redactor $GITHUB_REF_NAME" \
              --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "legal-redactor $GITHUB_REF_NAME" \
              --notes-file dist/RELEASE_NOTES.md
          fi
