# Optional. Enable after linking this GitHub repo as a PyPI trusted publisher
# (see CONTRIBUTING.md). Does not run on ordinary pushes.
name: PyPI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish to upload the current tag/commit to PyPI"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install -U build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
