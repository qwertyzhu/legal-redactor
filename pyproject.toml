[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-redactor"
version = "0.7.0"
description = "Local-first dual-mode redaction for Chinese legal documents (AI upload vs court/opponent production)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "qwertyzhu" }]
keywords = [
  "legal",
  "redaction",
  "pii",
  "privacy",
  "anonymization",
  "chinese",
  "docx",
  "pdf",
  "local-first",
]
dependencies = [
  "python-docx>=1.1,<2",
  "pymupdf>=1.24,<2",
  "lxml>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.urls]
Homepage = "https://github.com/qwertyzhu/legal-redactor"
Documentation = "https://github.com/qwertyzhu/legal-redactor#readme"
Repository = "https://github.com/qwertyzhu/legal-redactor"
Issues = "https://github.com/qwertyzhu/legal-redactor/issues"
Changelog = "https://github.com/qwertyzhu/legal-redactor/blob/main/CHANGELOG.md"

[project.scripts]
legal-redactor = "legal_redactor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
