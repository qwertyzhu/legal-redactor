[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-redactor"
version = "0.7.0"
description = "中国法律文书双模式脱敏：给 AI 前去标识，交法院/对方前只去证件号手机邮箱。本地运行，原格式返回。Local-first dual-mode redaction (ai vs production)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "qwertyzhu" }]
keywords = [
  "legal",
  "redaction",
  "pii",
  "privacy",
  "anonymization",
  "chinese",
  "docx",
  "pdf",
  "local-first",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Security",
  "Topic :: Text Processing",
  "Natural Language :: Chinese (Simplified)",
  "Intended Audience :: Developers",
]
dependencies = [
  "python-docx>=1.1,<2",
  "pymupdf>=1.24,<2",
  "lxml>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.urls]
Homepage = "https://github.com/qwertyzhu/legal-redactor"
Documentation = "https://github.com/qwertyzhu/legal-redactor#readme"
Repository = "https://github.com/qwertyzhu/legal-redactor"
Issues = "https://github.com/qwertyzhu/legal-redactor/issues"
Changelog = "https://github.com/qwertyzhu/legal-redactor/blob/main/CHANGELOG.md"

[project.scripts]
legal-redactor = "legal_redactor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
